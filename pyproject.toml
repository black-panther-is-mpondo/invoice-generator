[project]
name = "invoice-generator"
version = "0.1.0"
description = "JSON-driven invoice calculation foundation"
requires-python = ">=3.12"
dependencies = [
    "font-lato>=0.1.0",
    "ipykernel>=7.4.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]
